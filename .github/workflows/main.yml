name: Create Archive
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      public_release:
        description: 'Create public release'
        required: true
        type: boolean
        default: false

# Two packs built side by side, each from a fresh checkout: the full pack (dev, patreon, 20, 21) and the
# low one (patreon_low, 20_low, 21_low: no noted icons). Each uploads its zips to a draft release of the
# run's own, and the release job publishes that draft as the patreon release in place of the last one.
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  DRAFT: build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  pack:
    strategy:
      matrix:
        set: [full, low]
    runs-on: ubuntu-latest
    env:
      # what no zip takes from the pack folder
      EXCLUDE: '*.git* README.md *.schema* *.zip *.py run/* .vscode/* /cache/* cache/* armour/*'
      # the low pack's zips end _low
      SUFFIX: ${{ matrix.set == 'low' && '_low' || '' }}
    steps:
      - uses: actions/checkout@master

      - name: The run's draft release
        if: matrix.set == 'full'
        run: gh release create "$DRAFT" --draft --title patreon --notes ''

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build armour sheets
        # The leather armour looks, the flat textures of the models in armour/models/, made into the sheets
        # the armour shader reads.
        run: |
          pip install pillow numpy
          python .github/scripts/build_armour.py

      - name: Cache Minecraft shaders
        # Each release's text shader, read once from its client jar; a new release adds to it.
        uses: actions/cache@v4
        with:
          path: cache/mc_shaders
          key: mc-shaders-${{ github.run_id }}-${{ matrix.set }}
          restore-keys: mc-shaders-

      - name: The low pack's changes
        # No dev particles, and no noted icons: noted items show the note.
        if: matrix.set == 'low'
        run: |
          rm assets/minecraft/textures/particle/effect_*
          rm -R assets/minecraft/textures/item/custom/noted
          rm -R assets/ms/models/noted
          sed -i 's/ms:noted\/[a-zA-Z_0-9]*\b/ms:wooden_shovel\/note/g' assets/minecraft/models/item/carrot.json
          sed -i 's/ms:noted\/[a-zA-Z_0-9]*\b/ms:wooden_shovel\/note/g' assets/minecraft/models/item/feather.json

      - name: Build stack count icons
        # Every item is leather horse armour, its count in its dye: each model gets the count face the
        # item shader draws on, and the noted icons follow below zero.
        run: python .github/scripts/count_icons.py

      - name: Build slot text shaders
        # Every release since 1.18.2: the base copy for clients without overlays, and an overlay per
        # shader change after it.
        run: python .github/scripts/build_shaders.py

      - name: Armour shaders, by Stitch
        # The armour stitch (armour_stitch.py, written by build_armour.py) woven into Minecraft's armour
        # shaders for every release from 1.18.2, as overlays; the base folder holds 1.18.2's.
        uses: AshleyThew/stitch@v0
        with:
          pack: .

      - name: Archive dev
        if: matrix.set == 'full'
        uses: thedoctor0/zip-release@master
        with:
          filename: 'dev.zip'
          exclusions: ${{ env.EXCLUDE }}

      - name: Delete dev files
        if: matrix.set == 'full'
        run: rm assets/minecraft/textures/particle/effect_*

      - name: Archive patreon
        uses: thedoctor0/zip-release@master
        with:
          filename: 'patreon${{ env.SUFFIX }}.zip'
          exclusions: ${{ env.EXCLUDE }}

      - name: Run script
        # the items' own models, not their count copies, then the copies again from them
        run: |
          python .github/scripts/count_icons.py --restore
          python .github/scripts/process_input.py
          python .github/scripts/count_icons.py

      - name: Slot text shaders without a base copy
        # 1.20.3+ only: every client reads overlays, and one newer than them all keeps its own shader.
        run: |
          python .github/scripts/build_shaders.py --no-base
          rm -f assets/minecraft/shaders/core/rendertype_armor_cutout_no_cull.*

      - name: Armour shaders, by Stitch, without a base copy
        uses: AshleyThew/stitch@v0
        with:
          pack: .
          base: false

      - name: Archive 20
        uses: thedoctor0/zip-release@master
        with:
          filename: '20${{ env.SUFFIX }}.zip'
          exclusions: ${{ env.EXCLUDE }}

      - name: Upgrade resource pack
        uses: AshleyThew/minecraft-resource-pack-upgrader@v1.1.9
        with:
          input_path: './'

      - name: Stack count icons as 1.21.4 item models
        # In a screen the icon and its count, anywhere else the icon's own model. The upgrader runs in
        # Docker as root, so what it wrote is handed back to the runner first.
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          python .github/scripts/count_icons.py --items

      - name: Check item models' atlases
        # From 26.1 an item model mixing item textures with a missing one breaks its whole item.
        if: matrix.set == 'full'
        run: python .github/scripts/check_item_atlases.py

      - name: Archive 21
        uses: thedoctor0/zip-release@master
        with:
          filename: '21${{ env.SUFFIX }}.zip'
          exclusions: ${{ env.EXCLUDE }}

      - name: Upload to the run's draft release
        # the zips with their SHA1s, side by side; the full pack's job also brings run/noted.txt
        run: |
          for file in *.zip; do
            sha1sum "$file" | cut -d ' ' -f 1 > "$file.sha1"
          done
          files=(*.zip *.zip.sha1)
          if [ "${{ matrix.set }}" = full ]; then files+=(run/noted.txt); fi
          # the full pack's job made the draft as it began; wait for it no more than five minutes
          for i in $(seq 60); do gh release view "$DRAFT" >/dev/null 2>&1 && break; sleep 5; done
          printf '%s\n' "${files[@]}" | xargs -P 8 -I{} gh release upload "$DRAFT" {}

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Publish the patreon release
        # The old release goes only once the new one is complete. Its tag stays where it was.
        run: |
          gh release delete patreon --yes || echo 'No existing release found with tag patreon'
          gh release edit "$DRAFT" --tag patreon --title patreon --draft=false --latest

      - name: Fetch the zips for the public release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.public_release == 'true'
        run: gh release download patreon -p 'patreon*.zip' -p '20*.zip' -p '21*.zip'

      - name: Rename files for public release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.public_release == 'true'
        run: |
          mv patreon.zip resourcepack.zip
          mv patreon_low.zip resourcepack_low.zip
          mv 20.zip resourcepack_20.zip
          mv 20_low.zip resourcepack_20_low.zip
          mv 21.zip resourcepack_21.zip
          mv 21_low.zip resourcepack_21_low.zip

      - name: Calculate SHA1 Hashes
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.public_release == 'true'
        run: |
          for file in resourcepack.zip resourcepack_low.zip resourcepack_20.zip resourcepack_20_low.zip resourcepack_21.zip resourcepack_21_low.zip; do
            sha1sum $file | cut -d ' ' -f 1 > $file.sha1
          done

      - name: Upload Resourcepack Release with SHA1
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.public_release == 'true'
        run: |
          gh release delete resourcepack --yes || echo 'No existing release found with tag resourcepack'
          gh release create resourcepack --title Resourcepack --notes '' --latest
          ls resourcepack*.zip resourcepack*.zip.sha1 | xargs -P 8 -I{} gh release upload resourcepack {}

      - name: Update pack on server
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.public_release == 'true'
        run: curl -X GET "${{ secrets.UPDATE_URL }}"

  # a failed build leaves no half-filled draft behind; the last patreon release stays as it was
  cleanup:
    needs: pack
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "$DRAFT" --yes || true
